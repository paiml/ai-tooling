# Generated README is built from this file. Edit it, not README.md.

[example]
title       = "Closed shape rejects undeclared"
summary     = "a README's own frontmatter, judged by a SHACL shape it cannot see"
description = "This README validates itself. Its frontmatter becomes RDF, and a closed SHACL shape decides whether those claims are well formed -- a shape the document never sees and cannot negotiate with. Closed is the load-bearing word: SHACL says nothing about properties no shape mentions, so an open shape accepts any key you invent. Closing it inverts the default, and an undeclared key becomes a violation rather than a shrug. Three exit codes are the interface: 0 pass, 1 at least one violation, 2 the check could not run -- and 2 is never mapped to 0, because zero focus nodes and zero violations print the same reassuring number."
run         = "make check"
requires    = "Requires a Rust toolchain and Java 17+. Apache Jena is downloaded and sha256-verified by `make tools`; nothing under `tools/` is committed."

