name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The `gate` job is what the org ruleset "Green Main — unified gate enforcement"
# requires BY NAME. GitHub names a check run after the job id, so this job must
# stay named `gate` at the TOP LEVEL of this workflow; moved under a reusable
# workflow it reports as `<caller> / gate` and satisfies nothing.
#
# The work runs INSIDE `gate` rather than in a job it merely `needs:`. An
# aggregator that only inspects another job's result gates nothing by itself --
# `pmat comply` reads this workflow and says so (CB-2100), and it is right: the
# contexts a ruleset requires should be the contexts that actually execute the
# checks.
#
# The required contexts are also written down in
# .github/required-status-checks.txt, because the legacy branch-protection API
# answers 404 for a ruleset-protected branch, so a tool querying only that
# endpoint concludes this repository has no gate at all.
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 (Apache Jena 5.6.0 is compiled to class file 61)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache cargo tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-tools-${{ runner.os }}-deny0.19-bashrs

      - name: Install cargo-deny and bashrs
        run: |
          command -v cargo-deny >/dev/null 2>&1 || cargo install --locked cargo-deny
          command -v bashrs     >/dev/null 2>&1 || cargo install --locked bashrs

      - name: Course structure, examples, shell lint, supply chain, contexts
        run: make check

      # `pmat comply` is deliberately NOT run here. It exits 1 on CB-2100 in this
      # repository and in paiml/rmedia alike -- a condition neither repo can
      # currently satisfy -- so wiring it into the required check would make the
      # gate unpassable, and the only way out would be `|| true`, which is a gate
      # that cannot fail. Comply is run locally and reviewed; it is not faked here.
      - name: Per-example quality gates (fmt, clippy -D warnings, tests)
        run: |
          for d in examples/*/; do
            test -f "$d/Cargo.toml" || continue
            ( cd "$d" && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test )
          done
